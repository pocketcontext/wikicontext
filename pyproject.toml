[project]
name = "wikicontext-client"
version = "0.1.0"
description = "wikicontext portable client"
requires-python = ">=3.11"
dependencies = ["observecontext-client @ git+https://github.com/pocketcontext/observecontext.git@d10e84bb30ce607c03c62c03a4fdfd596d32ab27", "Pillow>=11,<13"]

[project.scripts]
wikicontext = "wikicontext_client.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/wikicontext_client"]
