name: WikiContext object storage experiment

on:
  push:
    branches: [experiment/object-storage]

permissions:
  contents: read

# Keep publication and handover in one serialized run, including reruns.
concurrency:
  group: wikicontext-once-v2-experiment
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/pocketcontext/wikicontext-v2

jobs:
  guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/object-storage'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the isolated experiment branch
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/experiment/object-storage

  tests:
    needs: guard
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish-and-deploy:
    needs: tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: once-v2
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native ARM64 experiment image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: wikicontext-v2:experiment-ci
          platforms: linux/arm64
          build-args: REVISION=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=experiment-arm64
          cache-to: type=gha,mode=max,scope=experiment-arm64
      - name: Install test client
        run: |
          python3 -m venv "$RUNNER_TEMP/client-venv"
          "$RUNNER_TEMP/client-venv/bin/pip" install .
          echo "$RUNNER_TEMP/client-venv/bin" >> "$GITHUB_PATH"
      - name: Check configuration, permissions and legacy recovery
        run: |
          python3 docker/smoke.py config --image wikicontext-v2:experiment-ci
          python3 docker/smoke.py smoke --image wikicontext-v2:experiment-ci
          python3 docker/smoke.py restore --image wikicontext-v2:experiment-ci
      - name: Build disposable object storage fixture
        run: docker build --file docker/minio.Dockerfile --tag wikicontext-minio:experiment-ci docker
      - name: Require S3 and Litestream fresh-volume recovery
        run: python3 docker/object_storage_smoke.py --image wikicontext-v2:experiment-ci --minio-image wikicontext-minio:experiment-ci
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only experimental tags
        run: |
          set -euo pipefail
          tag="experiment-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag wikicontext-v2:experiment-ci "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          docker tag wikicontext-v2:experiment-ci "$IMAGE:latest"
          docker push "$IMAGE:latest"
          printf 'Published `%s:%s` for `once-v2`.\n' "$IMAGE" "$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy through the experiment forced command
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SERVER_IP"
          test "$SERVER_USER" = deploy
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/once-v2-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          # The generic ONCE helper uses the public package; no registry token is sent.
          ssh -T -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 "$SERVER_USER@$SERVER_IP" </dev/null
      - name: Verify experiment health and source revision
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          for attempt in range(36):
              try:
                  request = urllib.request.Request('https://wiki-v2.pocketcontext.com/up', headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status == 200 and response.read() == b'OK' and response.headers.get('X-WikiContext-Revision') == os.environ['GITHUB_SHA']:
                          break
              except OSError:
                  pass
              time.sleep(5)
          else:
              raise SystemExit('Experiment health/source revision verification failed')
          PY
