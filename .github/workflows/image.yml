name: Container validation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main validation runs serialize; newer branch pushes cancel earlier branch checks.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/pocketcontext/wikicontext

jobs:
  # Every branch and pull request: build for the runner's architecture and run the image.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: wikicontext:ci
          build-args: REVISION=${{ github.sha }}
          provenance: false
          # Reuse validated native build layers.
          cache-from: type=gha,scope=amd
          cache-to: type=gha,mode=max,scope=amd
      - name: Show the image
        run: |
          docker image inspect wikicontext:ci --format '{{json .Config}}' | python3 -m json.tool
          docker run --rm --entrypoint sh wikicontext:ci -c 'set -eu; litestream version; pocketcontext --version; cat /app/POCKETCONTEXT_VERSION; find /app /usr/local/bin -type f | sort; test ! -e /app/pb_hooks/.gitkeep'
      - name: Startup errors for missing configuration
        run: python3 docker/smoke.py config --image wikicontext:ci
      - name: Smoke test
        run: python3 docker/smoke.py smoke --image wikicontext:ci
      - name: Restore drill
        run: python3 docker/smoke.py restore --image wikicontext:ci
