name: Container image
on:
  push:
    branches: [experiment/object-storage]

permissions:
  contents: read

# This workflow validates images only; experiment.yml owns isolated publication.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and validate both architectures on the experiment branch.
  check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment/object-storage'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd
            runner: ubuntu-24.04
          - arch: arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: wikicontext-v2:ci
          build-args: REVISION=${{ github.sha }}
          provenance: false
          # Reuse this architecture's validated build cache during publication.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Show the image
        run: |
          docker image inspect wikicontext-v2:ci --format '{{json .Config}}' | python3 -m json.tool
          docker run --rm --entrypoint sh wikicontext-v2:ci -c 'set -eu; litestream version; pocketcontext --version; cat /app/POCKETCONTEXT_VERSION; find /app /usr/local/bin -type f | sort; test ! -e /app/pb_hooks/.gitkeep'
      - name: Startup errors for missing configuration
        run: python3 docker/smoke.py config --image wikicontext-v2:ci
      - name: Smoke test
        run: python3 docker/smoke.py smoke --image wikicontext-v2:ci
      - name: Restore drill
        run: python3 docker/smoke.py restore --image wikicontext-v2:ci
